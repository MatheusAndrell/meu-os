<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EFEEE9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Meu OS</title>
    <script>
      try { var s = JSON.parse(localStorage.getItem('meu-os:v1')); if (s && s.settings && s.settings.design === 2 && s.settings.theme) document.documentElement.dataset.theme = s.settings.theme } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
